<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESP32 Encoder Test</title>
    <link rel="stylesheet" href="bootstrap-5.0.2-dist/css/bootstrap.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-container">
    <nav class="navbar navbar-dark dark-background text-white navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand">ESP32 Encoder</a>     
		<div>
			<button id="connect-button" class="btn btn-primary"
			>Connect Encoder</button>
      <div id="disconnected-container" style="display: none;">
        <div class="d-flex flex-column flex-m-row align-items-center">
          <span class="m-0">Connected ✅</span>
          <button id="disconnect-button" class="btn btn-danger py-0 rounded-pill" 
          >Disconnect</button>
        </div>
      </div>
		</div>
      </div>
    </nav>

  <div id="popup-container"></div>

	<div class="container position-relative pt-5 p-m-0">
    
		<div class="d-flex flex-row justify-content-center align-items-center gap-3 p-2 my-3">
      <button class="btn btn-transparent dir-button active" id="up-button">Up</button>
      <button class="btn btn-transparent dir-button" id="down-button">Down</button>
    </div>
    <div class="d-flex flex-row justify-content-between align-items-center">
      <div class="d-flex flex-row gap-2" style="width: fit-content;">
        <button id="concentric-button" class="btn dark-background text-white rounded-0 rounded-top border-0">
          Concentric
          <img src="img/concentric.png" height="40" />
        </button>
        <button id="eccentric-button" class="btn btn-transparent text-white rounded-0 rounded-top border-0">
          Eccentric
          <img src="img/eccentric.png" height="40" />
        </button>
      </div>
      <div>
        <button class="btn btn-danger" id="reset-button">Reset</button>
      </div>
    </div>
	
		<div class="row m-0 p-0 w-100 overflow-hidden shadow" id="reps-container" style="background-color: #effffd;">
		</div>
	</div>

  


    <script src="bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
